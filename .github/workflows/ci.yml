name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Vulnerability databases change without the code changing, so the scans
    # are re-run weekly rather than only on a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 ./...

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true

      # gosec: Go-specific static analysis for insecure patterns.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      # gosec again, this time deciding the job: SARIF above is for the
      # security tab, this is the gate.
      - name: gosec (gate)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      # staticcheck: correctness and misuse the compiler does not catch.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # govulncheck: known vulnerabilities in this code's actual call paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # The open-source rulesets, run locally: no account and no upload. The
      # examples are Terraform fixtures rather than shipped code.
      - run: |
          semgrep scan --error --quiet --exclude=examples \
            --config p/golang --config p/javascript --config p/secrets
