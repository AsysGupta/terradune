<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>terradune</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --card: #21252c; --line: #2a2e36;
    --text: #e6e8eb; --muted: #8b929c;
    --existing: #4a9eda; --create: #4cc38a; --destroy: #e0524c;
    --update: #e5b567; --replace: #e08a3c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; flex: none;
           padding: 10px 20px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  #dot.live { background: var(--create); }
  #dot.busy { background: var(--update); animation: pulse 1s infinite alternate; }
  #dot.down { background: var(--destroy); }
  @keyframes pulse { to { opacity: .3; } }
  .tabs { display: flex; gap: 4px; margin-left: 10px; }
  .tabs button { background: none; border: 1px solid transparent; color: var(--muted);
                 font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px;
                 cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--text); border-color: var(--line); }
  #meta { color: var(--muted); font-size: 12px; margin-left: auto;
          font-family: ui-monospace, Menlo, monospace; }
  #error { display: none; flex: none; padding: 10px 20px; background: #3a1f1a;
           color: #f0a08c; white-space: pre-wrap; font-size: 12px;
           font-family: ui-monospace, Menlo, monospace; }

  #map { flex: 1; min-height: 0; overflow: auto; padding: 20px; position: relative; }
  #ribbons { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .vpc-panel { position: relative; border: 1px solid var(--line); border-radius: 10px;
               background: #171a1f; margin-bottom: 24px; }
  .vpc-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
              border-bottom: 1px solid var(--line); }
  .vpc-head .title { font-weight: 600; }
  .vpc-head .sub { color: var(--muted); font-family: ui-monospace, Menlo, monospace;
                   font-size: 12px; }
  .cols { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr));
          gap: 0; position: relative; }
  .col { padding: 14px 16px 18px; border-right: 1px solid var(--line);
         min-width: 0; }
  .col:last-child { border-right: none; }
  .col > h3 { margin: 0 0 12px; font-size: 11px; color: var(--muted);
              text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .col > h3 span { color: #626a75; font-weight: 400; text-transform: none;
                   letter-spacing: 0; }
  .az { margin-bottom: 14px; }
  .az > h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted);
             font-weight: 500; font-family: ui-monospace, Menlo, monospace; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid var(--muted); border-radius: 6px;
          padding: 7px 10px; margin-bottom: 8px; cursor: default;
          transition: opacity .12s, border-color .12s, background .12s; }
  .card:last-child { margin-bottom: 0; }
  .card .n { font-weight: 500; overflow-wrap: anywhere; }
  .card .d { color: var(--muted); font-size: 11px;
             font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  .card .s { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .card.hi { background: #2b313a; }
  .dim { opacity: .18; }
  .empty { color: #545b66; font-size: 12px; font-style: italic; }
  .others { border: 1px solid var(--line); border-radius: 10px; background: #171a1f;
            padding: 14px 16px; }
  .others h3 { margin: 0 0 12px; font-size: 11px; color: var(--muted);
               text-transform: uppercase; letter-spacing: .08em; }
  .others .grid { display: grid; gap: 8px;
                  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  #graph { flex: 1; min-height: 0; display: none; cursor: grab; }
  #graph.panning { cursor: grabbing; }
  .node-box { fill: var(--card); stroke-width: 2; }
  .node-type { font: 600 12px ui-monospace, Menlo, monospace; }
  .node-name { font: 11px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .module-box { fill: none; stroke: var(--muted); stroke-dasharray: 6 4;
                stroke-width: 1; opacity: .7; }
  .module-label { font: 600 11px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .edge { fill: none; stroke: #566070; stroke-width: 1.3; opacity: .8; }

  #legend { position: fixed; right: 16px; bottom: 16px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px;
            font-size: 11px; z-index: 5; }
  #legend div { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  #legend i { width: 20px; height: 3px; border-radius: 2px; flex: none; }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <h1>terradune</h1>
  <div class="tabs">
    <button id="tab-map" class="on">Resource map</button>
    <button id="tab-graph">Graph</button>
  </div>
  <span id="meta"></span>
</header>
<div id="error"></div>
<div id="map"><svg id="ribbons"></svg><div id="mapbody"></div></div>
<svg id="graph"></svg>
<div id="legend">
  <div><i style="background:#4cc38a"></i> will be created</div>
  <div><i style="background:#4a9eda"></i> already exists</div>
  <div><i style="background:#e5b567"></i> will change</div>
  <div><i style="background:#e08a3c"></i> will be replaced</div>
  <div><i style="background:#e0524c"></i> will be destroyed</div>
</div>

<script src="/assets/elk.bundled.js"></script>
<script>
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const COLORS = { existing: '#4a9eda', create: '#4cc38a', update: '#e5b567',
                 replace: '#e08a3c', destroy: '#e0524c' };
const LABELS = {
  aws_vpc: 'VPC', aws_subnet: 'Subnet', aws_route_table: 'Route table',
  aws_route: 'Route', aws_route_table_association: 'Association',
  aws_internet_gateway: 'Internet gateway', aws_nat_gateway: 'NAT gateway',
  aws_egress_only_internet_gateway: 'Egress-only IGW',
  aws_vpn_gateway: 'VPN gateway', aws_vpc_peering_connection: 'Peering connection',
  aws_transit_gateway_vpc_attachment: 'Transit gateway attachment',
  aws_vpc_endpoint: 'VPC endpoint', aws_eip: 'Elastic IP',
  aws_security_group: 'Security group', aws_network_acl: 'Network ACL',
};
const GATEWAYS = new Set(['aws_internet_gateway', 'aws_nat_gateway',
  'aws_egress_only_internet_gateway', 'aws_vpn_gateway',
  'aws_vpc_peering_connection', 'aws_transit_gateway_vpc_attachment',
  'aws_vpc_endpoint']);
// Glue resources become ribbons in the map rather than cards of their own.
const GLUE = new Set(['aws_route', 'aws_route_table_association',
  'aws_main_route_table_association']);

const label = t => LABELS[t] || t.replace(/^aws_/, '').replace(/_/g, ' ');
const esc = t => String(t).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const idx = a => (a.match(/\[[^\]]+\]$/) || [''])[0];

// ---------- model -------------------------------------------------------
// Builds the VPC-console-style view: which subnets sit in which VPC and AZ,
// which route table each subnet is associated with, and which gateway each
// route table reaches — resolved through the glue resources.
function buildMap(state) {
  const nodes = new Map((state.nodes || []).map(n => [n.id, n]));
  const deps = new Map();   // id -> [ids it depends on]
  const rdeps = new Map();  // id -> [ids depending on it]
  for (const e of state.edges || []) {
    if (!deps.has(e.from)) deps.set(e.from, []);
    deps.get(e.from).push(e.to);
    if (!rdeps.has(e.to)) rdeps.set(e.to, []);
    rdeps.get(e.to).push(e.from);
  }
  const depsOfType = (id, pred) =>
    (deps.get(id) || []).filter(d => nodes.has(d) && pred(nodes.get(d)));

  const links = [];  // {a, b} card-to-card connections drawn as ribbons
  const add = (a, b) => { if (a && b && a !== b) links.push({ a, b }); };

  // subnet <-> route table, via associations
  for (const [id, n] of nodes) {
    if (n.type !== 'aws_route_table_association') continue;
    const subs = depsOfType(id, m => m.type === 'aws_subnet');
    const rts = depsOfType(id, m => m.type === 'aws_route_table');
    for (const s of subs) for (const r of rts) add(s, r);
  }
  // route table <-> gateway, via routes
  const rtGateways = new Map();
  for (const [id, n] of nodes) {
    if (n.type !== 'aws_route') continue;
    const rts = depsOfType(id, m => m.type === 'aws_route_table');
    const gws = depsOfType(id, m => GATEWAYS.has(m.type));
    for (const r of rts) {
      for (const g of gws) {
        add(r, g);
        if (!rtGateways.has(r)) rtGateways.set(r, new Set());
        rtGateways.get(r).add(nodes.get(g).type);
      }
    }
  }
  // direct containment / attachment edges
  for (const [id, n] of nodes) {
    if (n.type === 'aws_subnet' || n.type === 'aws_route_table' || GATEWAYS.has(n.type)) {
      for (const v of depsOfType(id, m => m.type === 'aws_vpc')) add(id, v);
    }
    if (n.type === 'aws_nat_gateway') {
      for (const s of depsOfType(id, m => m.type === 'aws_subnet')) add(id, s);
    }
  }

  // A subnet is public when a route table it is associated with reaches an
  // internet gateway — the same rule the VPC console uses.
  const subnetPublic = new Map();
  for (const { a, b } of links) {
    const [s, r] = nodes.get(a)?.type === 'aws_subnet' ? [a, b] : [b, a];
    if (nodes.get(s)?.type !== 'aws_subnet' || nodes.get(r)?.type !== 'aws_route_table') continue;
    if ((rtGateways.get(r) || new Set()).has('aws_internet_gateway')) subnetPublic.set(s, true);
    else if (!subnetPublic.has(s)) subnetPublic.set(s, false);
  }

  // Group everything by VPC (single-VPC configs put strays in that VPC).
  const vpcs = [...nodes.values()].filter(n => n.type === 'aws_vpc');
  const vpcOf = id => {
    const direct = depsOfType(id, m => m.type === 'aws_vpc');
    if (direct.length) return direct[0];
    for (const d of deps.get(id) || []) {
      const up = depsOfType(d, m => m.type === 'aws_vpc');
      if (up.length) return up[0];
    }
    return vpcs.length === 1 ? vpcs[0].id : null;
  };

  const panels = vpcs.map(v => ({ vpc: v, subnets: [], routeTables: [], gateways: [] }));
  const byVpc = new Map(panels.map(p => [p.vpc.id, p]));
  const others = [];
  for (const n of nodes.values()) {
    if (n.type === 'aws_vpc' || GLUE.has(n.type)) continue;
    const p = byVpc.get(vpcOf(n.id));
    if (!p) { others.push(n); continue; }
    if (n.type === 'aws_subnet') p.subnets.push(n);
    else if (n.type === 'aws_route_table') p.routeTables.push(n);
    else if (GATEWAYS.has(n.type)) p.gateways.push(n);
    else others.push(n);
  }
  return { panels, others, links, nodes, subnetPublic, glue: [...nodes.values()].filter(n => GLUE.has(n.type)) };
}

// ---------- render map --------------------------------------------------
function cardHTML(n, extra) {
  const nice = n.meta?.name || n.name + idx(n.id);
  const det = extra || n.meta?.cidr || n.meta?.id || n.name + idx(n.id);
  return `<div class="card" data-id="${esc(n.id)}" title="${esc(n.id)}"
      style="border-left-color:${COLORS[n.status] || '#8b929c'}">
    <div class="n">${esc(nice)}</div>
    <div class="d">${esc(label(n.type))}${det ? ' · ' + esc(det) : ''}</div>
  </div>`;
}

function renderMap(state) {
  const m = buildMap(state);
  const body = $('mapbody');

  if (!m.panels.length && !m.others.length) {
    body.innerHTML = '<div class="empty">No resources in this plan.</div>';
    $('ribbons').innerHTML = '';
    return;
  }

  body.innerHTML = m.panels.map(p => {
    const byAz = new Map();
    for (const s of p.subnets) {
      const az = s.meta?.az || 'no AZ';
      if (!byAz.has(az)) byAz.set(az, []);
      byAz.get(az).push(s);
    }
    const subnetCol = [...byAz.entries()].sort().map(([az, subs]) => `
      <div class="az"><h4>${esc(az)}</h4>
        ${subs.map(s => cardHTML(s, [
            m.subnetPublic.get(s.id) ? 'public' : 'private',
            s.meta?.cidr,
          ].filter(Boolean).join(' · '))).join('')}
      </div>`).join('') || '<div class="empty">none</div>';

    const col = (title, items) => `<div class="col">
        <h3>${title} <span>(${items.length})</span></h3>
        ${items.length ? items.map(n => cardHTML(n)).join('') : '<div class="empty">none</div>'}
      </div>`;

    return `<div class="vpc-panel">
      <div class="vpc-head">
        <span class="title">${esc(p.vpc.meta?.name || p.vpc.name)}</span>
        <span class="sub">${esc(p.vpc.meta?.cidr || '')} ${esc(p.vpc.meta?.id || '')}</span>
        <span class="s" style="margin-left:auto;color:${COLORS[p.vpc.status]}">${esc(p.vpc.status)}</span>
      </div>
      <div class="cols">
        <div class="col"><h3>VPC</h3>${cardHTML(p.vpc)}</div>
        <div class="col"><h3>Subnets <span>(${p.subnets.length})</span></h3>${subnetCol}</div>
        ${col('Route tables', p.routeTables)}
        ${col('Network connections', p.gateways)}
      </div>
    </div>`;
  }).join('') + (m.others.length ? `<div class="others">
      <h3>Other resources <span>(${m.others.length})</span></h3>
      <div class="grid">${m.others.map(n => cardHTML(n)).join('')}</div>
    </div>` : '');

  drawRibbons(m);
  wireHover(m);
}

function drawRibbons(m) {
  const svg = $('ribbons');
  svg.innerHTML = '';
  const scroll = $('map');
  const base = scroll.getBoundingClientRect();
  const box = id => {
    const el = scroll.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left - base.left + scroll.scrollLeft, y: r.top - base.top + scroll.scrollTop,
             w: r.width, h: r.height };
  };
  svg.setAttribute('width', scroll.scrollWidth);
  svg.setAttribute('height', scroll.scrollHeight);

  for (const { a, b } of m.links) {
    const A = box(a), B = box(b);
    if (!A || !B) continue;
    // draw left-to-right so ribbons read like the console's
    const [L, R] = A.x <= B.x ? [A, B] : [B, A];
    const x1 = L.x + L.w, y1 = L.y + L.h / 2, x2 = R.x, y2 = R.y + R.h / 2;
    if (x2 < x1) continue; // same column: skip rather than draw a hook
    const mx = (x1 + x2) / 2;
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#3d4552');
    p.setAttribute('stroke-width', '1.6');
    p.dataset.a = a; p.dataset.b = b;
    svg.appendChild(p);
  }
}

function wireHover(m) {
  const scroll = $('map');
  const cards = [...scroll.querySelectorAll('.card')];
  const paths = [...$('ribbons').querySelectorAll('path')];
  const adj = new Map();
  for (const { a, b } of m.links) {
    if (!adj.has(a)) adj.set(a, new Set());
    if (!adj.has(b)) adj.set(b, new Set());
    adj.get(a).add(b); adj.get(b).add(a);
  }
  const clear = () => {
    cards.forEach(c => c.classList.remove('dim', 'hi'));
    paths.forEach(p => { p.classList.remove('dim'); p.setAttribute('stroke', '#3d4552'); });
  };
  for (const card of cards) {
    card.addEventListener('mouseenter', () => {
      // reachable set: the full path through the map, like the console's hover
      const seen = new Set([card.dataset.id]);
      const queue = [card.dataset.id];
      while (queue.length) {
        for (const next of adj.get(queue.shift()) || []) {
          if (!seen.has(next)) { seen.add(next); queue.push(next); }
        }
      }
      cards.forEach(c => {
        c.classList.toggle('dim', !seen.has(c.dataset.id));
        c.classList.toggle('hi', seen.has(c.dataset.id));
      });
      paths.forEach(p => {
        const on = seen.has(p.dataset.a) && seen.has(p.dataset.b);
        p.classList.toggle('dim', !on);
        p.setAttribute('stroke', on ? '#6b7787' : '#3d4552');
      });
    });
    card.addEventListener('mouseleave', clear);
  }
}

// ---------- graph tab (ELK) ---------------------------------------------
const elk = new ELK();
const CHAR = 7.3, PAD_X = 14, NODE_H = 46;
let view = { x: 0, y: 0, k: 1 }, firstGraphDraw = true;
const world = document.createElementNS(svgNS, 'g');
$('graph').appendChild(world);
const applyView = () => world.setAttribute('transform',
  `translate(${view.x},${view.y}) scale(${view.k})`);
$('graph').addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  const r = $('graph').getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f;
  applyView();
}, { passive: false });
let pan = null;
$('graph').addEventListener('mousedown', e => {
  pan = { x: e.clientX - view.x, y: e.clientY - view.y };
  $('graph').classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  view.x = e.clientX - pan.x; view.y = e.clientY - pan.y; applyView();
});
window.addEventListener('mouseup', () => { pan = null; $('graph').classList.remove('panning'); });

function toElk(state) {
  const groups = new Map();
  const root = { id: '__root__', layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'RIGHT',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
      'elk.spacing.nodeNode': '24',
      'elk.layered.spacing.nodeNodeBetweenLayers': '56',
      'elk.padding': '[top=20,left=20,bottom=20,right=20]' },
    children: [], edges: [] };
  groups.set('', root);
  const groupFor = addr => {
    if (groups.has(addr)) return groups.get(addr);
    const parent = groupFor(addr.replace(/(^|\.)module\.[^.]+$/, ''));
    const g = { id: 'group:' + addr, isModule: true,
      label: addr.slice(addr.lastIndexOf('module.')),
      layoutOptions: { 'elk.padding': '[top=34,left=16,bottom=16,right=16]' },
      children: [], edges: [] };
    parent.children.push(g); groups.set(addr, g); return g;
  };
  for (const n of state.nodes || []) {
    groupFor(n.module).children.push({ id: n.id, node: n,
      width: Math.max(n.type.length, n.name.length + 2) * CHAR + PAD_X * 2,
      height: NODE_H });
  }
  for (const e of state.edges || []) {
    root.edges.push({ id: e.from + '>' + e.to, sources: [e.from], targets: [e.to] });
  }
  return root;
}

function drawGraph(layout) {
  world.innerHTML = '';
  const defs = document.createElementNS(svgNS, 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#566070"/></marker>`;
  world.appendChild(defs);
  const el = (name, attrs, parent) => {
    const x = document.createElementNS(svgNS, name);
    for (const [k, v] of Object.entries(attrs)) x.setAttribute(k, v);
    parent.appendChild(x); return x;
  };
  const pos = new Map();
  const edgeLayer = el('g', {}, world), nodeLayer = el('g', {}, world);
  (function walk(node, ox, oy) {
    for (const c of node.children || []) {
      const x = ox + c.x, y = oy + c.y;
      if (c.isModule) {
        el('rect', { class: 'module-box', x, y, width: c.width, height: c.height, rx: 8 }, nodeLayer);
        el('text', { class: 'module-label', x: x + 14, y: y + 22 }, nodeLayer).textContent = c.label;
        walk(c, x, y);
      } else {
        pos.set(c.id, { x, y, w: c.width, h: c.height });
        const n = c.node, color = COLORS[n.status] || '#8b929c';
        const box = el('rect', { class: 'node-box', x, y, width: c.width,
          height: c.height, rx: 6, stroke: color }, nodeLayer);
        if (n.status === 'destroy') box.setAttribute('opacity', '0.65');
        if (n.status === 'create') box.setAttribute('stroke-dasharray', '7 4');
        el('text', { class: 'node-type', x: x + PAD_X, y: y + 19, fill: color },
          nodeLayer).textContent = n.type;
        el('text', { class: 'node-name', x: x + PAD_X, y: y + 36 },
          nodeLayer).textContent = n.name + idx(n.id);
      }
    }
  })(layout, 0, 0);
  for (const e of layout.edges || []) {
    const s = pos.get(e.sources[0]), t = pos.get(e.targets[0]);
    if (!s || !t) continue;
    let x1, y1, x2, y2;
    if (t.x >= s.x + s.w) { x1 = s.x + s.w; x2 = t.x; }
    else if (t.x + t.w <= s.x) { x1 = s.x; x2 = t.x + t.w; }
    else {
      x1 = s.x + s.w / 2; x2 = t.x + t.w / 2;
      const down = t.y >= s.y + s.h;
      y1 = down ? s.y + s.h : s.y; y2 = down ? t.y : t.y + t.h;
      el('path', { class: 'edge', 'marker-end': 'url(#arrow)',
        d: `M ${x1} ${y1} C ${x1} ${(y1 + y2) / 2}, ${x2} ${(y1 + y2) / 2}, ${x2} ${y2}` }, edgeLayer);
      continue;
    }
    y1 = s.y + s.h / 2; y2 = t.y + t.h / 2;
    const mx = (x1 + x2) / 2;
    el('path', { class: 'edge', 'marker-end': 'url(#arrow)',
      d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}` }, edgeLayer);
  }
  if (firstGraphDraw) {
    const r = $('graph').getBoundingClientRect();
    const k = Math.min(r.width / (layout.width + 80), r.height / (layout.height + 80), 1.5);
    view = { x: (r.width - layout.width * k) / 2, y: (r.height - layout.height * k) / 2, k };
    applyView(); firstGraphDraw = false;
  }
}

// ---------- tabs + live state -------------------------------------------
let tab = 'map', latest = null;
function setTab(t) {
  tab = t;
  $('tab-map').classList.toggle('on', t === 'map');
  $('tab-graph').classList.toggle('on', t === 'graph');
  $('map').style.display = t === 'map' ? 'block' : 'none';
  $('graph').style.display = t === 'graph' ? 'block' : 'none';
  if (latest) paint(latest);
}
$('tab-map').onclick = () => setTab('map');
$('tab-graph').onclick = () => setTab('graph');

async function paint(s) {
  if (tab === 'map') renderMap(s);
  else drawGraph(await elk.layout(toElk(s)));
}

async function render(s) {
  latest = s;
  $('dot').className = s.rebuilding ? 'busy' : 'live';
  $('meta').textContent = `terraform ${s.terraformVersion || '?'} · ` +
    `${(s.nodes || []).length} resources · ${new Date(s.generatedAt).toLocaleTimeString()}`;
  $('error').style.display = s.error ? 'block' : 'none';
  $('error').textContent = s.error || '';
  if (s.rebuilding || s.error) return; // keep the current view on screen
  await paint(s);
}

window.addEventListener('resize', () => { if (latest && tab === 'map') renderMap(latest); });

const es = new EventSource('/events');
es.onmessage = e => render(JSON.parse(e.data)).catch(err => {
  $('error').style.display = 'block';
  $('error').textContent = 'render error: ' + err.message;
});
es.onerror = () => { $('dot').className = 'down'; };
</script>
</body>
